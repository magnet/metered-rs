[package]
name = "metered-macro"
version = "0.10.0-rc.1"
authors = ["Simon Chemouil <simon.chemouil@lambdacube.fr>"]
license = "Apache-2.0 OR MIT"
readme = "../README.md"
keywords = ["metrics", "macro"]
repository = "https://github.com/magnet/metered-rs"
description = """
The derive macros of the metered metric library (MetricTree, LabelSet,
SpanLabels), consumed through the `metered` and `metered-tracing` re-exports.
"""
categories = ["rust-patterns", "development-tools::profiling", "data-structures", "algorithms", "asynchronous"]
edition = "2024"
rust-version = "1.85"

[dependencies]
syn = {version= "1.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
metered = { package = "metered-core", path = "../metered-core" }
metered-om = { path = "../metered-om" }

[lib]
proc-macro = true