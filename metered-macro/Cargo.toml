[package]
name = "metered-macro"
version = "0.10.0"
authors = ["Simon Chemouil <simon.chemouil@lambdacube.fr>"]
license = "Apache-2.0 OR MIT"
readme = "../README.md"
keywords = ["metrics", "macro"]
repository = "https://github.com/magnet/metered-rs"
description = """
Fast, ergonomic metrics for Rust!
"""
categories = ["rust-patterns", "development-tools::profiling", "data-structures", "algorithms", "asynchronous"]
edition = "2021"
rust-version = "1.70"

[dependencies]
syn = {version= "1.0", features = ["full"] }
aspect-weave = "0.2"
synattra = "0.2"
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.4"

[dev-dependencies]
metered = { path = "../metered" }
# The semantic model is what `#[metered]` / `#[error_count]` generate code for,
# so the macro doctests exercise it. Dev-only edge (cycle allowed by Cargo).
metered-semantic = { path = "../metered-semantic" }
metered-om = { path = "../metered-om" }
thiserror = "1.0"
rand = "0.8"

[lib]
proc-macro = true