[package]
name = "metered-telemetry-process"
version = "0.10.0-rc.1"
authors = ["Simon Chemouil <simon.chemouil@lambdacube.fr>"]
license = "Apache-2.0 OR MIT"
readme = "../README.md"
repository = "https://github.com/magnet/metered-rs"
description = "Standard process telemetry (CPU, memory, file descriptors) as metered MetricTree values."
edition = "2024"
rust-version = "1.85"

[dependencies]
metered = { package = "metered-core", version = "0.10.0-rc.1", path = "../metered-core" }
metrics-process = { version = "2.4.3", default-features = false }

[dev-dependencies]
metered-om = { version = "0.10.0-rc.1", path = "../metered-om" }
