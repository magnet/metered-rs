[package]
name = "metered-telemetry-system"
version = "0.10.0"
authors = ["Simon Chemouil <simon.chemouil@lambdacube.fr>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/magnet/metered-rs"
description = "Host system telemetry (CPU, memory, swap, load, uptime) as metered MetricTree values."
edition = "2021"
rust-version = "1.70"

[features]
# Optional helper to drive sampling from a background Tokio task, keeping the
# scrape path free of any OS sampling work.
tokio = ["dep:tokio"]

[dependencies]
metered = { version = "0.10.0", path = "../metered" }
parking_lot = "0.12"
sysinfo = { version = "0.39.3", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[dev-dependencies]
metered-om = { version = "0.10.0", path = "../metered-om" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
