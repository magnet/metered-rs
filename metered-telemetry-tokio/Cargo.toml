[package]
name = "metered-telemetry-tokio"
version = "0.10.0-rc.1"
authors = ["Simon Chemouil <simon.chemouil@lambdacube.fr>"]
license = "Apache-2.0 OR MIT"
readme = "../README.md"
repository = "https://github.com/magnet/metered-rs"
description = "Tokio runtime and task telemetry as metered MetricTree values."
edition = "2024"
rust-version = "1.85"

[dependencies]
metered = { package = "metered-core", version = "0.10.0-rc.1", path = "../metered-core" }
tokio = { version = "1", features = ["rt"] }
tokio-metrics = "0.3"

[dev-dependencies]
metered-om = { version = "0.10.0-rc.1", path = "../metered-om" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
