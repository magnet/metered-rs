name: docs

on:
  push:
    # metered-v2 deploys the book while the 0.10 line is in release-candidate
    # review; drop it from this list when the branch merges to master.
    branches: [master, main, metered-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mdBook
        run: cargo install mdbook --locked
      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid --locked
      - name: Install mermaid assets
        run: mdbook-mermaid install .
      - name: Build book
        run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
