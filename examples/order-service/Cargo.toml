[package]
name = "order-service-demo"
version = "0.10.0-rc.1"
authors = ["Simon Chemouil <simon.chemouil@lambdacube.fr>"]
license = "Apache-2.0 OR MIT"
description = "Runnable order-service demo wiring metered, metered-om, and metered-tracing end to end (not published)."
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
metered = { path = "../../metered" }
metered-om = { path = "../../metered-om" }
metered-tracing = { path = "../../metered-tracing", features = ["exemplar"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
