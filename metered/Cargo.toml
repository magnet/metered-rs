[package]
name = "metered"
version = "0.10.0-rc.1"
authors = ["Simon Chemouil <simon.chemouil@lambdacube.fr>"]
license = "Apache-2.0 OR MIT"
readme = "../README.md"
keywords = ["metrics", "macro"]
repository = "https://github.com/magnet/metered-rs"
description = """
Fast, ergonomic metrics for Rust! The one-dependency facade over the metered
workspace: the core model re-exported wholesale, satellite crates behind
features.
"""
categories = ["rust-patterns", "development-tools::profiling", "data-structures", "algorithms", "asynchronous"]
edition = "2024"
rust-version = "1.85"

[dependencies]
metered-core = { version = "0.10.0-rc.1", path = "../metered-core" }
metered-macro = { version = "0.10.0-rc.1", path = "../metered-macro" }
metered-om = { version = "0.10.0-rc.1", path = "../metered-om", optional = true }
metered-tracing = { version = "0.10.0-rc.1", path = "../metered-tracing", optional = true }
metered-telemetry-tokio = { version = "0.10.0-rc.1", path = "../metered-telemetry-tokio", optional = true }
metered-telemetry-process = { version = "0.10.0-rc.1", path = "../metered-telemetry-process", optional = true }
metered-telemetry-system = { version = "0.10.0-rc.1", path = "../metered-telemetry-system", optional = true }

[dev-dependencies]
metered-om = { version = "0.10.0-rc.1", path = "../metered-om" }

[features]
# no features by default
default = []

# Ambient, thread-local exemplar context in the core model.
exemplar-context = ["metered-core/exemplar-context"]

# Satellite crates, re-exported as facade modules.
om = ["dep:metered-om"]
tracing = ["dep:metered-tracing"]
telemetry-tokio = ["dep:metered-telemetry-tokio"]
telemetry-process = ["dep:metered-telemetry-process"]
telemetry-system = ["dep:metered-telemetry-system"]

# Everything at once.
full = ["om", "tracing", "telemetry-tokio", "telemetry-process", "telemetry-system", "exemplar-context"]
