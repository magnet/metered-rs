[package]
name = "metered-core"
version = "0.10.0-rc.1"
authors = ["Simon Chemouil <simon.chemouil@lambdacube.fr>"]
license = "Apache-2.0 OR MIT"
readme = "../README.md"
keywords = ["metrics", "macro"]
repository = "https://github.com/magnet/metered-rs"
description = """
The core metric model of metered (state, composition, schema/values), consumed
through the `metered` facade or directly by libraries.
"""
categories = ["rust-patterns", "development-tools::profiling", "data-structures", "algorithms", "asynchronous"]
edition = "2024"
rust-version = "1.85"

[dependencies]
metered-macro = { version = "0.10.0-rc.1", path = "../metered-macro" }
parking_lot = "0.12"
# Lock-free atomic Arc swap, used by `DynamicExponentialHistogram` for RCU-style
# schema downscaling: observers load the current table lock-free, the
# off-hot-path maintenance task swaps in a coarser one.
arc-swap = "1"

[dev-dependencies]
# The facade re-exports this crate wholesale, so doctests written against the
rand = "0.8"
proptest = "1.0"
serde = { version = "1.0", features = ["derive"] }
# The OpenMetrics sink lives in its own crate; the core crate only needs it to
# exercise the text exposition in its own tests, doctests, and examples. This is
# a dev-only dependency edge, so the `metered` -> `metered-om` -> `metered`
# cycle is allowed by Cargo (and never affects downstream builds).
metered-om = { path = "../metered-om", version = "0.10.0-rc.1" }

[features]
# no features by default
default = []

# Ambient, thread-local exemplar context (`ThreadLocalExemplars` +
# `set_current_exemplar` / `with_exemplar`). Opt-in because it relies on ambient
# state; lets a tracing layer wire exemplars to the active trace with no
# tracing/OpenTelemetry dependency in metered itself.
exemplar-context = []

[[bench]]
name = "histogram_backends"
harness = false


